<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rememba">
<title>Rememba</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: rgba(255,255,255,0.08);
    --text: #f0ede8;
    --text2: rgba(240,237,232,0.5);
    --text3: rgba(240,237,232,0.25);
    --green: #9FE1CB;
    --green-dim: rgba(159,225,203,0.12);
    --blue-dim: rgba(176,213,244,0.12);
    --amber-dim: rgba(250,199,117,0.12);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    gap: 0;
  }

  .login-logo {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }

  .login-logo svg { width: 36px; height: 36px; }

  .login-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 10px;
  }

  .login-sub {
    font-size: 15px;
    color: var(--text2);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 48px;
    max-width: 260px;
  }

  .btn-google {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--text);
    color: #0f0f0f;
    border: none;
    border-radius: var(--radius);
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
    justify-content: center;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-google:active { opacity: 0.85; transform: scale(0.98); }

  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

  .login-disclaimer {
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    margin-top: 24px;
    line-height: 1.6;
    max-width: 280px;
  }

  /* ── APP SCREEN ── */
  #app-screen { display: none; }

  /* Header */
  .header {
    padding: 52px 20px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    overflow: hidden;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .app-wordmark {
    font-size: 13px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .avatar-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--green);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #04342C;
    overflow: hidden;
    transition: opacity 0.15s;
  }

  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-btn:active { opacity: 0.7; }

  .month-year {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .entry-count {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 14px;
  }

  /* Day strip — horizontal */
  .day-strip-wrapper {
    overflow: hidden;
    width: 100%;
  }
  .day-strip {
    display: flex;
    gap: 4px;
    overflow-x: scroll;
    padding: 0 0 14px;
    scrollbar-width: none;
    border-bottom: 0.5px solid var(--border);
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    width: 100%;
  }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-pill {
    scroll-snap-align: start;
    min-width: 48px;
    max-width: 48px;
    flex-shrink: 0;
  }

  /* Day strip — vertical (modo izquierda) */
  .day-strip-vertical {
    display: none;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    scrollbar-width: none;
    width: 60px;
    flex-shrink: 0;
    padding-right: 4px;
    border-right: 0.5px solid var(--border);
    position: sticky;
    top: 180px;
    height: 396px;
    align-self: flex-start;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .day-strip-vertical::-webkit-scrollbar { display: none; }
  .day-strip-vertical .day-pill {
    scroll-snap-align: start;
    flex-shrink: 0;
  }

  /* Layout con columna izquierda */
  .app-body {
    display: flex;
    gap: 0;
    min-height: calc(100vh - 180px);
    align-items: flex-start;
  }

  .app-body .timeline {
    flex: 1;
    min-width: 0;
    padding-left: 12px;
  }

  /* Shared pill styles */
  .day-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 10px;
    border-radius: 12px;
    cursor: pointer;
    min-width: 44px;
    transition: background 0.15s;
    gap: 4px;
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--text);
  }
  .day-pill:hover { background: rgba(255,255,255,0.05); }
  .day-pill.active { background: var(--text); }

  /* Vertical pill — más compacto */
  .day-strip-vertical .day-pill {
    min-width: unset;
    width: 52px;
    padding: 6px 4px;
    border-radius: 10px;
    gap: 2px;
  }
  .day-strip-vertical .dp-name { font-size: 9px; }
  .day-strip-vertical .dp-num { font-size: 15px; }

  .dp-name {
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .day-pill.active .dp-name { color: rgba(15,15,15,0.45); }

  .dp-num {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }
  .day-pill.active .dp-num { color: #0f0f0f; }

  .dp-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--green);
  }
  .day-pill.active .dp-dot { background: rgba(15,15,15,0.3); }
  .dp-dot-empty { width: 4px; height: 4px; }

  /* Timeline */
  .timeline {
    padding: 20px 20px 140px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .day-section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 8px;
    margin-bottom: 2px;
  }

  /* On This Day */
  .otd-card {
    background: rgba(159,225,203,0.05);
    border: 0.5px solid rgba(159,225,203,0.18);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    gap: 12px;
  }

  .otd-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }

  .otd-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .otd-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.55;
  }

  /* Entry cards */
  .entry-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }

  .entry-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 6px;
  }

  .entry-icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .ei-note { background: rgba(240,237,232,0.08); }
  .ei-photo { background: var(--blue-dim); }
  .ei-audio { background: var(--green-dim); }
  .ei-video { background: var(--amber-dim); }

  .entry-meta { flex: 1; min-width: 0; }

  .entry-author {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-time {
    font-size: 11px;
    color: var(--text3);
    margin-top: 1px;
  }

  .privacy-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .pb-family { background: var(--green-dim); color: var(--green); }
  .pb-private { background: rgba(240,237,232,0.06); color: var(--text3); }

  .entry-body { padding: 4px 14px 14px; }

  .entry-text {
    font-size: 15px;
    color: var(--text);
    line-height: 1.55;
    margin-bottom: 8px;
  }

  /* Photo grid */
  .photo-grid { border-radius: 10px; overflow: hidden; display: grid; gap: 2px; }
  .photo-grid.g1 { grid-template-columns: 1fr; }
  .photo-grid.g2 { grid-template-columns: 1fr 1fr; }
  .photo-grid.g3 { grid-template-columns: 1fr 1fr; }

  .photo-thumb {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--surface2);
    cursor: pointer;
    display: block;
  }

  .photo-thumb.wide { aspect-ratio: 16/9; grid-column: 1/-1; }

  /* Audio player */
  .audio-player {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.04);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .play-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--green);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }

  .play-btn:active { opacity: 0.8; }
  .play-btn svg { width: 12px; height: 12px; fill: #04342C; margin-left: 1px; }

  .audio-waves {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 24px;
  }

  .wave-bar {
    width: 3px;
    border-radius: 2px;
    background: rgba(159,225,203,0.35);
    flex-shrink: 0;
  }

  .audio-dur { font-size: 11px; color: var(--text3); font-weight: 600; }

  /* Tags */
  .tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

  .tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 500;
  }

  .tag-person { background: rgba(240,237,232,0.06); color: var(--text2); }

  /* Empty state */
  .empty-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    gap: 12px;
    opacity: 0.5;
  }

  .empty-day-icon { font-size: 32px; }
  .empty-day-text { font-size: 14px; color: var(--text2); text-align: center; }

  /* Upload progress */
  .upload-progress {
    background: var(--surface);
    border: 0.5px solid rgba(159,225,203,0.3);
    border-radius: var(--radius);
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }

  .upload-progress-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .upload-spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .upload-label { font-size: 13px; color: var(--text); font-weight: 500; }

  .upload-bar-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .upload-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    animation: uploadPulse 1.5s ease-in-out infinite;
  }

  @keyframes uploadPulse {
    0% { width: 15%; }
    50% { width: 85%; }
    100% { width: 15%; }
  }

  /* FAB bar */
  .fab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    padding: 16px 20px 34px;
    background: linear-gradient(to top, #0f0f0f 65%, transparent);
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .fab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: var(--surface);
    border: 0.5px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    padding: 11px 14px 9px;
    cursor: pointer;
    flex: 1;
    max-width: 72px;
    transition: background 0.15s, transform 0.1s;
    color: var(--text2);
    font-size: 10px;
    font-weight: 500;
  }

  .fab-btn:hover { background: var(--surface2); }
  .fab-btn:active { transform: scale(0.95); }
  .fab-icon { font-size: 19px; }

  .fab-main {
    background: var(--text);
    color: #0f0f0f;
    border-color: transparent;
    max-width: 60px;
    border-radius: 18px;
  }

  .fab-main:hover { background: #e8e5e0; }
  .fab-main .fab-icon { font-size: 22px; }

  /* Bottom sheet */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: flex-end;
    z-index: 200;
    backdrop-filter: blur(2px);
  }

  .overlay.open { display: flex; }

  .sheet {
    background: #1c1c1e;
    border-radius: 24px 24px 0 0;
    padding: 12px 20px 40px;
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    animation: slideUp 0.2s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .sheet-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
  }

  .sheet-options { display: flex; flex-direction: column; gap: 8px; }

  .sheet-opt {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 13px 16px;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
    text-align: left;
  }

  .sheet-opt:hover { background: rgba(255,255,255,0.08); }
  .sheet-opt:active { transform: scale(0.99); }

  .so-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }

  .so-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .so-sub {
    font-size: 12px;
    color: var(--text2);
    margin-top: 1px;
  }

  /* Note sheet */
  .note-area {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 120px;
    line-height: 1.5;
  }

  .note-area::placeholder { color: var(--text3); }
  .note-area:focus { border-color: rgba(159,225,203,0.3); }

  .privacy-select {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .priv-btn {
    flex: 1;
    padding: 9px;
    border-radius: 10px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .priv-btn.selected {
    background: var(--green-dim);
    border-color: rgba(159,225,203,0.3);
    color: var(--green);
  }

  .sheet-submit {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    background: var(--text);
    color: #0f0f0f;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .sheet-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .sheet-submit:not(:disabled):active { opacity: 0.85; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    z-index: 300;
    border: 0.5px solid var(--border);
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; }

  /* Hidden inputs */
  #file-input-photo, #file-input-video { display: none; }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 400;
  }

  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px; }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── DATE NAV TOGGLE ── */
  .nav-toggle-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text3);
    font-size: 13px;
    padding: 5px 9px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .nav-toggle-btn:hover { background: rgba(255,255,255,0.06); color: var(--text2); }

  /* ── SIDE PANEL ── */
  .side-panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    display: none;
    backdrop-filter: blur(2px);
  }
  .side-panel-overlay.open { display: block; }

  .side-panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    background: #1a1a1a;
    z-index: 301;
    transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    flex-direction: column;
    padding: 52px 0 32px;
  }

  .side-panel.open { transform: translateX(0); }

  .side-panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 20px 16px;
    border-bottom: 0.5px solid var(--border);
  }

  .side-panel-selected {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
    padding: 14px 20px 4px;
    line-height: 1.2;
  }

  .side-panel-selected-sub {
    font-size: 13px;
    color: var(--text3);
    padding: 0 20px 16px;
  }

  /* Drum wheel */
  .wheel-container {
    display: flex;
    gap: 0;
    padding: 0 12px;
    flex: 1;
    align-items: center;
    position: relative;
  }

  .wheel-container::before,
  .wheel-container::after {
    content: '';
    position: absolute;
    left: 12px;
    right: 12px;
    height: 1px;
    background: rgba(159,225,203,0.25);
    pointer-events: none;
    z-index: 2;
  }

  .wheel-container::before { top: calc(50% - 22px); }
  .wheel-container::after  { top: calc(50% + 22px); }

  .wheel-col {
    flex: 1;
    overflow: hidden;
    position: relative;
    height: 220px;
    cursor: ns-resize;
    user-select: none;
  }

  .wheel-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.15s ease-out;
  }

  .wheel-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;

<script>
// ── CONFIG ──
const CLIENT_ID = '475374822010-11q1sf3m4sf817bhhcgq1ss9mbmloprf.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/photoslibrary.readonly';
const REMEMBA_FOLDER = 'Rememba';

// ── STATE ──
let tokenClient = null;
let accessToken = null;
let currentUser = null;
let entries = [];
let selectedDay = new Date().getDate();
let selectedMonth = new Date().getMonth();
let selectedYear = new Date().getFullYear();
let driveRootId = null;
let sharedFolderId = null;
let personalFolderId = null;
let selectedPrivacy = 'familia';
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordingInterval = null;
let recordingSeconds = 0;

const DAYS_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── INIT ──
window.onload = () => {
  const saved = localStorage.getItem('rememba_token');
  const savedUser = localStorage.getItem('rememba_user');
  if (saved && savedUser) {
    accessToken = saved;
    currentUser = JSON.parse(savedUser);
    showApp();
  }
  initGoogleAuth();
};

function initGoogleAuth() {
  const script = document.createElement('script');
  script.src = 'https://accounts.google.com/gsi/client';
  script.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: handleTokenResponse,
    });
  };
  document.head.appendChild(script);
}

document.getElementById('btn-signin').onclick = () => {
  if (tokenClient) tokenClient.requestAccessToken();
};

async function handleTokenResponse(response) {
  if (response.error) { showToast('Error al iniciar sesión'); return; }
  accessToken = response.access_token;
  await fetchUserInfo();
  localStorage.setItem('rememba_token', accessToken);
  localStorage.setItem('rememba_user', JSON.stringify(currentUser));
  showApp();
}

async function fetchUserInfo() {
  const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  currentUser = await r.json();
}

function handleSignOut() {
  if (!confirm('¿Cerrar sesión?')) return;
  localStorage.removeItem('rememba_token');
  localStorage.removeItem('rememba_user');
  accessToken = null;
  currentUser = null;
  entries = [];
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ── SHOW APP ──
async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';

  // Set avatar
  const initials = currentUser?.name
    ? currentUser.name.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase()
    : 'AS';

  const avatarEl = document.getElementById('avatar-btn');
  if (currentUser?.picture) {
    avatarEl.innerHTML = `<img src="${currentUser.picture}" alt="${initials}">`;
  } else {
    document.getElementById('avatar-initials').textContent = initials;
  }

  renderHeader();
  renderDayStrip();
  initNavMode();
  await initDriveFolders();
  await loadEntries();
  renderTimeline();

  // Event listener delegado — montado una sola vez, funciona para todas las cards
  document.getElementById('timeline').addEventListener('click', (e) => {
    const editBtn = e.target.closest('.edit-note-btn');
    if (editBtn) {
      e.stopPropagation();
      editNote(editBtn.getAttribute('data-id'));
      return;
    }
    const privBtn = e.target.closest('.toggle-privacy-btn');
    if (privBtn) {
      e.stopPropagation();
      openPrivacyPopup(privBtn.getAttribute('data-id'), privBtn);
      return;
    }
    const optBtn = e.target.closest('.entry-options-btn');
    if (optBtn) {
      e.stopPropagation();
      openOptionsPopup(optBtn.getAttribute('data-id'), optBtn.getAttribute('data-type'), optBtn);
    }
  });


}

// ── DRIVE FOLDERS ──
async function initDriveFolders() {
  driveRootId = await getOrCreateFolder(REMEMBA_FOLDER, 'root');
  sharedFolderId = await getOrCreateFolder('compartido', driveRootId);
  personalFolderId = await getOrCreateFolder('personal', driveRootId);
}

async function getOrCreateFolder(name, parentId) {
  const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
  const r = await driveApi(`files?q=${encodeURIComponent(q)}&fields=files(id,name)`);
  if (r.files && r.files.length > 0) return r.files[0].id;

  const body = {
    name,
    mimeType: 'application/vnd.google-apps.folder',
    parents: [parentId]
  };

  const res = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  const f = await res.json();
  return f.id;
}

async function driveApi(path, options = {}) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/${path}`, {
    ...options,
    headers: {
      Authorization: `Bearer ${accessToken}`,
      ...(options.headers || {})
    }
  });
  if (!r.ok) {
    const err = await r.json();
    console.error('Drive API error:', err);
    return {};
  }
  return r.json();
}

// ── LOAD ENTRIES from Drive ──
async function loadEntries() {
  entries = [];
  const folderId = sharedFolderId;
  if (!folderId) return;

  // Load metadata JSON files
  const q = `name contains 'entry_' and '${folderId}' in parents and trashed=false and mimeType='application/json'`;
  const r = await driveApi(`files?q=${encodeURIComponent(q)}&fields=files(id,name,createdTime)&orderBy=createdTime desc&pageSize=100`);

  if (!r.files) return;

  for (const f of r.files) {
    try {
      const content = await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const entry = await content.json();
      entries.push(entry);
    } catch(e) { console.error('Error loading entry:', e); }
  }

  entries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

// ── RENDER HEADER ──
function renderHeader() {
  document.getElementById('month-year').textContent = `${MONTHS_ES[selectedMonth]} ${selectedYear}`;
  const dayEntries = entries.filter(e => {
    const d = new Date(e.timestamp);
    return d.getMonth() === selectedMonth && d.getFullYear() === selectedYear;
  });
  document.getElementById('entry-count').textContent =
    dayEntries.length === 0 ? 'Sin entradas este mes' :
    `${dayEntries.length} entrada${dayEntries.length !== 1 ? 's' : ''} este mes`;
}

// ── RENDER DAY STRIP ──
function renderDayStrip() {
  const strip = document.getElementById('day-strip');
  strip.innerHTML = '';
  const today = new Date();
  const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();

  for (let d = 1; d <= daysInMonth; d++) {
    if (d > today.getDate() && selectedMonth === today.getMonth() && selectedYear === today.getFullYear()) break;

    const date = new Date(selectedYear, selectedMonth, d);
    const hasEntry = entries.some(e => {
      const ed = new Date(e.timestamp);
      return ed.getDate() === d && ed.getMonth() === selectedMonth && ed.getFullYear() === selectedYear;
    });

    const pill = document.createElement('button');
    pill.className = 'day-pill' + (d === selectedDay ? ' active' : '');
    pill.innerHTML = `
      <span class="dp-name">${DAYS_ES[date.getDay()]}</span>
      <span class="dp-num">${d}</span>
      ${hasEntry ? '<span class="dp-dot"></span>' : '<span class="dp-dot-empty"></span>'}
    `;
    pill.onclick = () => {
      selectedDay = d;
      document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderTimeline();
    };
    strip.appendChild(pill);
  }

  // scroll to selected
  setTimeout(() => {
    const active = strip.querySelector('.day-pill.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }, 100);
}

// ── RENDER TIMELINE ──
function renderTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  const dayEntries = entries.filter(e => {
    const d = new Date(e.timestamp);
    return d.getDate() === selectedDay && d.getMonth() === selectedMonth && d.getFullYear() === selectedYear;
  });

  // On This Day
  const lastYear = entries.filter(e => {
    const d = new Date(e.timestamp);
    return d.getDate() === selectedDay && d.getMonth() === selectedMonth && d.getFullYear() === selectedYear - 1;
  });

  if (lastYear.length > 0) {
    const otd = document.createElement('div');
    otd.className = 'otd-card';
    otd.innerHTML = `
      <span class="otd-icon">✦</span>
      <div>
        <div class="otd-label">En este día · hace 1 año</div>
        <div class="otd-text">${lastYear[0].text || 'Tenías una entrada guardada este día.'}</div>
      </div>
    `;
    tl.appendChild(otd);
  }

  // Day label
  const date = new Date(selectedYear, selectedMonth, selectedDay);
  const isToday = date.toDateString() === new Date().toDateString();
  const label = document.createElement('div');
  label.className = 'day-section-label';
  label.textContent = isToday
    ? `Hoy · ${selectedDay} de ${MONTHS_ES[selectedMonth].toLowerCase()}`
    : `${selectedDay} de ${MONTHS_ES[selectedMonth].toLowerCase()}`;
  tl.appendChild(label);

  if (dayEntries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-day';
    empty.innerHTML = `
      <span class="empty-day-icon">📭</span>
      <span class="empty-day-text">Sin entradas este día.<br>Toca + para agregar algo.</span>
    `;
    tl.appendChild(empty);
    return;
  }

  dayEntries.forEach(entry => tl.appendChild(buildEntryCard(entry)));
  renderHeader();

  // Cargar fotos como blob para evitar el problema del token expirado
  loadPhotosAsBlob();
}

async function loadPhotosAsBlob() {
  // Cargar fotos
  const imgs = document.querySelectorAll('img[data-fid]');
  for (const img of imgs) {
    if (img.src && img.src.startsWith('blob:')) continue;
    const fid = img.getAttribute('data-fid');
    if (!fid) continue;
    try {
      const r = await fetch('https://www.googleapis.com/drive/v3/files/' + fid + '?alt=media', {
        headers: { Authorization: 'Bearer ' + accessToken }
      });
      if (!r.ok) continue;
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      img.src = url;
      img.onclick = () => openLightbox(url);
      img.style.cursor = 'pointer';
    } catch(e) { console.error('Photo load error:', e); }
  }

  // Cargar videos
  const videos = document.querySelectorAll('video[data-fid]');
  for (const video of videos) {
    if (video.src && video.src.startsWith('blob:')) continue;
    const fid = video.getAttribute('data-fid');
    if (!fid) continue;
    try {
      const r = await fetch('https://www.googleapis.com/drive/v3/files/' + fid + '?alt=media', {
        headers: { Authorization: 'Bearer ' + accessToken }
      });
      if (!r.ok) continue;
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      video.src = url;
      video.innerHTML = ''; // quitar el texto de "Cargando..."
    } catch(e) { console.error('Video load error:', e); }
  }
}

function buildEntryCard(entry) {
  const card = document.createElement('div');
  card.className = 'entry-card';

  const typeMap = { note: '✏️', photo: '📷', audio: '🎙', video: '🎬' };
  const classMap = { note: 'ei-note', photo: 'ei-photo', audio: 'ei-audio', video: 'ei-video' };

  const time = new Date(entry.timestamp).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  const authorName = entry.authorName || currentUser?.given_name || 'Tú';
  const isPrivate = entry.privacy === 'privado';

  let bodyHTML = '';

  if (entry.type === 'note' && entry.text) {
    bodyHTML += `<p class="entry-text">${escapeHTML(entry.text)}</p>`;
  }

  if (entry.type === 'photo' && entry.fileIds && entry.fileIds.length > 0) {
    const count = entry.fileIds.length;
    const gridClass = count === 1 ? 'g1' : count === 2 ? 'g2' : 'g3';
    bodyHTML += `<div class="photo-grid ${gridClass}">`;
    entry.fileIds.forEach((fid, i) => {
      const isWide = count === 3 && i === 0;
      bodyHTML += `<img class="photo-thumb${isWide ? ' wide' : ''}" 
        data-fid="${fid}"
        style="background:var(--surface2)"
        alt="foto">`;
    });
    bodyHTML += `</div>`;
    if (entry.text) bodyHTML += `<p class="entry-text" style="margin-top:8px">${escapeHTML(entry.text)}</p>`;
  }

  if (entry.type === 'audio' && entry.fileId) {
    const bars = Array.from({length: 18}, (_, i) => {
      const h = [6,10,14,18,12,8,16,20,10,14,8,18,12,6,16,10,14,8][i];
      return `<div class="wave-bar" style="height:${h}px"></div>`;
    }).join('');

    bodyHTML += `
      <div class="audio-player">
        <button class="play-btn" onclick="playAudio('${entry.fileId}', this)">
          <svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg>
        </button>
        <div class="audio-waves">${bars}</div>
        <span class="audio-dur">${entry.duration || '0:00'}</span>
      </div>
    `;
    if (entry.text) bodyHTML += `<p class="entry-text" style="margin-top:8px">${escapeHTML(entry.text)}</p>`;
  }

  if (entry.type === 'video' && entry.fileId) {
    bodyHTML += `
      <video controls style="width:100%;border-radius:10px;max-height:220px;background:#000;cursor:pointer"
        data-fid="${entry.fileId}" data-type="video">
        <p style="color:var(--text2);text-align:center;padding:20px;font-size:13px">Cargando video...</p>
      </video>
    `;
    if (entry.text) bodyHTML += `<p class="entry-text" style="margin-top:8px">${escapeHTML(entry.text)}</p>`;
  }

  if (entry.tags && entry.tags.length > 0) {
    bodyHTML += `<div class="tag-row">${entry.tags.map(t => `<span class="tag tag-person">${t}</span>`).join('')}</div>`;
  }

  const editBtn = entry.type === 'note'
    ? ''  // botón derecho eliminado — el ícono izquierdo es ahora el botón de editar
    : '';

  card.innerHTML = `
    <div class="entry-header">
      ${entry.type === 'note'
        ? `<button class="edit-note-btn" data-id="${entry.id || ''}" style="width:30px;height:30px;border-radius:9px;background:rgba(240,237,232,0.08);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;pointer-events:auto" title="Editar nota">&#9998;</button>`
        : `<div class="entry-icon ${classMap[entry.type] || 'ei-note'}">${typeMap[entry.type] || '&#128247;'}</div>`
      }
      <div class="entry-meta">
        <div class="entry-author">${authorName}</div>
        <div class="entry-time">${time}${entry.weather ? ' · ' + entry.weather : ''}</div>
      </div>
      <button class="toggle-privacy-btn" data-id="${entry.id}" style="font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;flex-shrink:0;border:none;cursor:pointer;${isPrivate ? 'background:rgba(240,237,232,0.06);color:rgba(240,237,232,0.35)' : 'background:rgba(159,225,203,0.12);color:#9FE1CB'}">${isPrivate ? '🔒 solo yo' : '🌐 familia'}</button>
      <button class="entry-options-btn" data-id="${entry.id}" data-type="${entry.type}">···</button>
    </div>
    <div class="entry-body">${bodyHTML}</div>
  `;

  return card;
}

function selectPrivacy(val) {
  selectedPrivacy = val;
  document.getElementById('priv-familia').classList.toggle('selected', val === 'familia');
  document.getElementById('priv-privado').classList.toggle('selected', val === 'privado');
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  if (isRecording) stopRecording();
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeSheet();
}

// ── SAVE NOTE ──
async function saveNote() {
  const text = document.getElementById('note-text').value.trim();
  if (!text) return;

  const btn = document.getElementById('note-submit');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  const entry = buildEntry('note', { text });
  await saveEntryToMeta(entry);

  closeSheet();
  showToast('Nota guardada ✓');
}

// ── OPTIONS POPUP ──
let optionsPopupEntryId = null;
let optionsPopupEntryType = null;

function openOptionsPopup(entryId, entryType, btnEl) {
  optionsPopupEntryId = entryId;
  optionsPopupEntryType = entryType;
  const popup = document.getElementById('options-popup');
  const backdrop = document.getElementById('options-backdrop');
  const editOpt = document.getElementById('opt-edit');

  // Solo mostrar editar para notas
  editOpt.textContent = entryType === 'note' ? '✏️ Editar nota' : '✏️ Editar comentario';
  editOpt.style.display = 'flex';

  const rect = btnEl.getBoundingClientRect();
  popup.style.top = (rect.bottom + 6) + 'px';
  popup.style.left = Math.min(rect.left - 100, window.innerWidth - 160) + 'px';

  popup.classList.add('open');
  backdrop.classList.add('open');
}

function closeOptionsPopup() {
  document.getElementById('options-popup').classList.remove('open');
  document.getElementById('options-backdrop').classList.remove('open');
  optionsPopupEntryId = null;
  optionsPopupEntryType = null;
}

function optEdit() {
  const id = optionsPopupEntryId;
  const type = optionsPopupEntryType;
  closeOptionsPopup();
  if (type === 'note') {
    editNote(id);
  } else {
    editComment(id);
  }
}

function editComment(entryId) {
  const entry = entries.find(e => e.id === entryId);
  if (!entry) return;
  const overlay = document.getElementById('overlay');
  const content = document.getElementById('sheet-content');
  overlay.classList.add('open');
  content.innerHTML = `
    <div class="sheet-title">Editar comentario</div>
    <textarea class="note-area" id="comment-text" placeholder="Agrega un comentario...">${(entry.text || '').replace(/</g,'&lt;')}</textarea>
    <button class="sheet-submit" style="margin-top:14px" onclick="saveEditedComment('${entryId}')">Guardar</button>
  `;
  setTimeout(() => document.getElementById('comment-text').focus(), 100);
}

async function saveEditedComment(entryId) {
  const text = document.getElementById('comment-text').value.trim();
  const idx = entries.findIndex(e => e.id === entryId);
  if (idx === -1) return;
  entries[idx].text = text;
  showUploadProgress('Guardando comentario...');
  const q = "name='" + entryId + ".json' and '" + sharedFolderId + "' in parents and trashed=false";
  const r = await driveApi('files?q=' + encodeURIComponent(q) + '&fields=files(id)');
  if (r.files && r.files.length > 0) {
    const fid = r.files[0].id;
    await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fid + '?uploadType=media', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(entries[idx])
    });
  }
  removeUploadProgress();
  closeSheet();
  renderTimeline();
  showToast('Comentario guardado ✓');
}

function optChangeDate() {
  const id = optionsPopupEntryId;
  closeOptionsPopup();
  openDatePicker(id);
}

function openDatePicker(entryId) {
  const entry = entries.find(e => e.id === entryId);
  if (!entry) return;

  const d = new Date(entry.timestamp);
  const today = new Date();
  const currentYear = today.getFullYear();

  // Poblar selects
  const dayEl = document.getElementById('dp-day');
  const monthEl = document.getElementById('dp-month');
  const yearEl = document.getElementById('dp-year');

  dayEl.innerHTML = Array.from({length:31},(_,i)=>`<option value="${i+1}" ${i+1===d.getDate()?'selected':''}>${String(i+1).padStart(2,'0')}</option>`).join('');
  monthEl.innerHTML = MONTHS_ES.map((m,i)=>`<option value="${i}" ${i===d.getMonth()?'selected':''}>${m}</option>`).join('');
  yearEl.innerHTML = Array.from({length:11},(_,i)=>`<option value="${currentYear-i}" ${currentYear-i===d.getFullYear()?'selected':''}>${currentYear-i}</option>`).join('');

  document.getElementById('date-picker-overlay').dataset.entryId = entryId;
  document.getElementById('date-picker-overlay').classList.add('open');
}

function closeDatePicker() {
  document.getElementById('date-picker-overlay').classList.remove('open');
}

async function confirmDateChange() {
  const entryId = document.getElementById('date-picker-overlay').dataset.entryId;
  const idx = entries.findIndex(e => e.id === entryId);
  if (idx === -1) return;

  const day = parseInt(document.getElementById('dp-day').value);
  const month = parseInt(document.getElementById('dp-month').value);
  const year = parseInt(document.getElementById('dp-year').value);

  const oldDate = new Date(entries[idx].timestamp);
  const newDate = new Date(year, month, day, oldDate.getHours(), oldDate.getMinutes(), oldDate.getSeconds());
  entries[idx].timestamp = newDate.toISOString();

  closeDatePicker();
  showUploadProgress('Guardando cambio de fecha...');

  const q = "name='" + entryId + ".json' and '" + sharedFolderId + "' in parents and trashed=false";
  const r = await driveApi('files?q=' + encodeURIComponent(q) + '&fields=files(id)');
  if (r.files && r.files.length > 0) {
    const fid = r.files[0].id;
    await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fid + '?uploadType=media', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(entries[idx])
    });
  }

  removeUploadProgress();
  renderDayStrip();
  renderTimeline();
  showToast('Fecha actualizada ✓');
}

async function optDelete() {
  const entryId = optionsPopupEntryId;
  closeOptionsPopup();
  if (!entryId) return;
  if (!confirm('¿Eliminar esta entrada?')) return;

  const idx = entries.findIndex(e => e.id === entryId);
  if (idx === -1) return;

  // Buscar y eliminar el JSON de metadatos en Drive
  const q = "name='" + entryId + ".json' and '" + sharedFolderId + "' in parents and trashed=false";
  const r = await driveApi('files?q=' + encodeURIComponent(q) + '&fields=files(id)');
  if (r.files && r.files.length > 0) {
    const fid = r.files[0].id;
    await fetch('https://www.googleapis.com/drive/v3/files/' + fid, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + accessToken }
    });
  }

  entries.splice(idx, 1);
  renderDayStrip();
  renderTimeline();
  showToast('Entrada eliminada');
}

function closePrivacyPopup() {
  document.getElementById('privacy-popup').classList.remove('open');
  document.getElementById('privacy-backdrop').classList.remove('open');
  privacyPopupEntryId = null;
}

async function setPrivacyFromPopup(newPrivacy) {
  const entryId = privacyPopupEntryId;
  closePrivacyPopup();
  if (!entryId) return;

  const idx = entries.findIndex(e => e.id === entryId);
  if (idx === -1) return;
  if (entries[idx].privacy === newPrivacy) return; // sin cambio

  entries[idx].privacy = newPrivacy;
  const q = "name='" + entryId + ".json' and '" + sharedFolderId + "' in parents and trashed=false";
  const r = await driveApi('files?q=' + encodeURIComponent(q) + '&fields=files(id)');
  if (r.files && r.files.length > 0) {
    const fid = r.files[0].id;
    await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fid + '?uploadType=media', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(entries[idx])
    });
  }
  renderTimeline();
  showToast(newPrivacy === 'privado' ? '🔒 Solo tú lo ves' : '🌐 Visible para familia');
}

async function saveEditedNote(entryId) {

  showUploadProgress('Guardando cambios...');
  const q = "name='" + entryId + ".json' and '" + sharedFolderId + "' in parents and trashed=false";
  const r = await driveApi('files?q=' + encodeURIComponent(q) + '&fields=files(id)');
  if (r.files && r.files.length > 0) {
    const fid = r.files[0].id;
    await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fid + '?uploadType=media', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(entries[idx])
    });

  removeUploadProgress();
  closeSheet();
  renderTimeline();

}

async function openGPhotosPicker(mediaType) {
  gPhotosSelected = [];
  gPhotosMediaType = mediaType || 'photo';
  closeSheet();

  const overlay = document.getElementById('gphotos-overlay');
  const body = document.getElementById('gphotos-body');

  btn.textContent = 'Seleccionar (0)';
  btn.disabled = true;
  overlay.classList.add('open');

  try {
    // Usar el filtro correcto según tipo
    const filterParam = gPhotosMediaType === 'video'
      ? '?filters.mediaTypeFilter.mediaTypes=VIDEO'
      : '?filters.mediaTypeFilter.mediaTypes=PHOTO';

    const r = await fetch('https://photoslibrary.googleapis.com/v1/mediaItems' + filterParam + '&pageSize=60', {
      headers: { Authorization: 'Bearer ' + accessToken }
    });

    if (!r.ok) {
      body.innerHTML = '<div class="gphotos-loading">No se pudo cargar Google Fotos. Intenta de nuevo.</div>';
      return;
    }

    const data = await r.json();
    const items = data.mediaItems || [];

    if (items.length === 0) {
      body.innerHTML = '<div class="gphotos-loading">No hay ' + (gPhotosMediaType === 'video' ? 'videos' : 'fotos') + ' en tu biblioteca.</div>';
      return;
    }

    body.className = 'gphotos-grid';
    body.innerHTML = items.map(item => `
      <div class="gphotos-item" data-id="${item.id}" data-url="${item.baseUrl}" data-name="${item.filename}" data-mime="${item.mimeType}">
        <img src="${item.baseUrl}=w200-h200-c" loading="lazy" alt="${item.filename}">
      </div>
    `).join('');

    body.querySelectorAll('.gphotos-item').forEach(el => {
      el.addEventListener('click', () => {
        el.classList.toggle('selected');
        const id = el.dataset.id;
        if (el.classList.contains('selected')) {
          gPhotosSelected.push({ id, url: el.dataset.url, name: el.dataset.name, mime: el.dataset.mime });
        } else {
          gPhotosSelected = gPhotosSelected.filter(x => x.id !== id);
        }
        btn.textContent = `Seleccionar (${gPhotosSelected.length})`;
        btn.disabled = gPhotosSelected.length === 0;
      });
    });

  } catch(e) {
    console.error('Google Photos error:', e);
    body.innerHTML = '<div class="gphotos-loading">Error al cargar Google Fotos.</div>';
  }
}

async function uploadFromGPhotos(items, type, comment) {
  showUploadProgress(`Guardando ${items.length > 1 ? 'recuerdos' : 'un recuerdo'} desde Google Fotos...`);

  const fileIds = [];
  for (const item of items) {
    try {
      // Descargar el archivo desde Google Photos y subirlo a Drive
      const downloadUrl = item.url + (type === 'video' ? '=dv' : '=d');
      const r = await fetch(downloadUrl);
      const blob = await r.blob();
      const file = new File([blob], item.name, { type: item.mime || 'image/jpeg' });
      const id = await uploadFileToDrive(file, sharedFolderId);
      if (id) fileIds.push(id);
    } catch(e) {
      console.error('GPhotos upload error:', e);
    }
  }

  if (type === 'video' && fileIds.length > 0) {
    const extras = { fileId: fileIds[0] };
    if (comment) extras.text = comment;
    const entry = buildEntry('video', extras);
    await saveEntryToMeta(entry);
    showToast('Recuerdo en video guardado ✓');
  } else if (fileIds.length > 0) {
    const extras = { fileIds };
    if (comment) extras.text = comment;
    const entry = buildEntry('photo', extras);
    await saveEntryToMeta(entry);
    showToast(`${fileIds.length > 1 ? 'Recuerdos guardados' : 'Recuerdo guardado'} ✓`);
  }

  removeUploadProgress();
}

// ── RECORDING ──
async function toggleRecording() {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      recordingSeconds = 0;

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = handleRecordingStop;
      mediaRecorder.start();
      isRecording = true;

      document.getElementById('rec-btn').textContent = 'Detener grabación';
      document.getElementById('rec-btn').style.background = '#E24B4A';

      recordingInterval = setInterval(() => {
        recordingSeconds++;
        const m = Math.floor(recordingSeconds / 60);
        const s = recordingSeconds % 60;
        const time = `${m}:${s.toString().padStart(2,'0')}`;
        document.getElementById('rec-status').innerHTML = `
          <div style="font-size:48px;margin-bottom:12px">🔴</div>
          <div style="color:var(--green);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">${time}</div>
          <div style="color:var(--text2);font-size:13px;margin-top:6px">Grabando...</div>
        `;
      }, 1000);
    } catch(e) {
      showToast('Sin acceso al micrófono');
    }
  } else {
    stopRecording();
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  clearInterval(recordingInterval);
  isRecording = false;
}

async function handleRecordingStop() {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const m = Math.floor(recordingSeconds / 60);
  const s = recordingSeconds % 60;
  const duration = `${m}:${s.toString().padStart(2,'0')}`;

  closeSheet();
  showUploadProgress('Guardando un recuerdo en audio...');

  const file = new File([blob], `audio_${Date.now()}.webm`, { type: 'audio/webm' });
  const fileId = await uploadFileToDrive(file, sharedFolderId);

  if (fileId) {
    const entry = buildEntry('audio', { fileId, duration });
    await saveEntryToMeta(entry);
    showToast('Audio guardado ✓');
  }

  removeUploadProgress();
}

// ── UPLOAD FILE TO DRIVE ──
async function uploadFileToDrive(file, parentId) {
  const metadata = { name: file.name, parents: [parentId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', file);

  const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: `Bearer ${accessToken}` },
    body: form
  });

  if (!r.ok) return null;
  const data = await r.json();
  return data.id;
}

// ── BUILD + SAVE ENTRY ──
function buildEntry(type, extras = {}) {
  // Usa el día seleccionado en el strip, no necesariamente hoy
  const now = new Date();
  const entryDate = new Date(selectedYear, selectedMonth, selectedDay,
    now.getHours(), now.getMinutes(), now.getSeconds());

  return {
    id: `entry_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    type,
    timestamp: entryDate.toISOString(),
    authorId: currentUser?.id || 'anon',
    authorName: currentUser?.given_name || 'Anwar',
    privacy: selectedPrivacy,
    weather: null,
    tags: [],
    ...extras
  };
}

async function saveEntryToMeta(entry) {
  const json = JSON.stringify(entry);
  const file = new File([json], `${entry.id}.json`, { type: 'application/json' });
  await uploadFileToDrive(file, sharedFolderId);
  entries.unshift(entry);
  if (navMode === 'left') {
    renderDayStripVertical();
  } else {
    renderDayStrip();
  }
  renderTimeline();
}

  for (let y = currentYear; y >= currentYear - 10; y--) years.push(y);

  buildWheel('wheel-inner-day', 31, wheelDay - 1, (i) => String(i + 1).padStart(2,'0'), (i) => { wheelDay = i + 1; updateSidePanelLabel(); });
  buildWheel('wheel-inner-month', 12, wheelMonth, (i) => months[i], (i) => { wheelMonth = i; updateSidePanelLabel(); });
  buildWheel('wheel-inner-year', years.length, years.indexOf(wheelYear) >= 0 ? years.indexOf(wheelYear) : 0, (i) => String(years[i]), (i) => { wheelYear = years[i]; updateSidePanelLabel(); });
}

function buildWheel(innerId, count, selectedIdx, labelFn, onChangeFn) {
  const inner = document.getElementById(innerId);
  const col = inner.parentElement;
  inner.innerHTML = '';

  // padding arriba y abajo para que el centro sea el seleccionado
  const pad = 2;
  for (let p = 0; p < pad; p++) {
    const spacer = document.createElement('div');
    spacer.className = 'wheel-item';
    inner.appendChild(spacer);
  }

  for (let i = 0; i < count; i++) {
    const item = document.createElement('div');
    item.className = 'wheel-item' + (i === selectedIdx ? ' selected' : '');
    item.textContent = labelFn(i);
    inner.appendChild(item);
  }

  for (let p = 0; p < pad; p++) {
    const spacer = document.createElement('div');
    spacer.className = 'wheel-item';
    inner.appendChild(spacer);
  }

  const itemH = 44;
  let currentIdx = selectedIdx;
  inner.style.transform = `translateY(${-currentIdx * itemH}px)`;

  // Touch/mouse drag
  let startY = 0;
  let startOffset = 0;
  let isDragging = false;

  function getOffset() {
    const t = inner.style.transform;
    const m = t.match(/translateY\((-?[\d.]+)px\)/);
    return m ? parseFloat(m[1]) : 0;
  }

  function snapTo(idx) {
    idx = Math.max(0, Math.min(count - 1, idx));
    currentIdx = idx;
    inner.style.transition = 'transform 0.2s ease-out';
    inner.style.transform = `translateY(${-idx * itemH}px)`;
    inner.querySelectorAll('.wheel-item').forEach((el, i) => {
      el.classList.toggle('selected', i - pad === idx);
    });
    setTimeout(() => { inner.style.transition = ''; }, 200);
    onChangeFn(idx);
  }

  function onStart(y) {
    isDragging = true;
    startY = y;
    startOffset = getOffset();
    inner.style.transition = '';
  }

  function onMove(y) {
    if (!isDragging) return;
    const delta = y - startY;
    const newOffset = startOffset + delta;
    inner.style.transform = `translateY(${newOffset}px)`;
    const newIdx = Math.round(-newOffset / itemH);
    const clamped = Math.max(0, Math.min(count - 1, newIdx));
    inner.querySelectorAll('.wheel-item').forEach((el, i) => {
      el.classList.toggle('selected', i - pad === clamped);
    });
  }

  function onEnd(y) {
    if (!isDragging) return;
    isDragging = false;
    const delta = y - startY;
    const newOffset = startOffset + delta;
    const newIdx = Math.round(-newOffset / itemH);
    snapTo(newIdx);
  }

  col.addEventListener('mousedown', e => { onStart(e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (isDragging) onMove(e.clientY); });
  window.addEventListener('mouseup', e => { if (isDragging) onEnd(e.clientY); });

  col.addEventListener('touchstart', e => { onStart(e.touches[0].clientY); }, { passive: true });
  col.addEventListener('touchmove', e => { onMove(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  col.addEventListener('touchend', e => { onEnd(e.changedTouches[0].clientY); });

  // Scroll wheel (desktop)
  col.addEventListener('wheel', e => {
    e.preventDefault();
    const dir = e.deltaY > 0 ? 1 : -1;
    snapTo(currentIdx + dir);
  }, { passive: false });
}

</script>
</body>
</html>
